server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the backend's MAX_UPLOAD_MB (default 25)
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: stream progress immediately, keep long connections open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # pdf.js loads its worker as an ES module, which browsers only accept with a JS MIME type.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
