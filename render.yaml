# One-click deploy on Render: https://render.com/deploy
# Neo4j is not hosted here: create a free AuraDB instance (https://console.neo4j.io)
# and paste its URI and password when Render asks for the secret values below.
services:
  - type: web
    name: synapse-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEO4J_URI          # e.g. neo4j+s://xxxxxxxx.databases.neo4j.io
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Free instances have no persistent disk, so kept PDFs vanish on redeploy and the
      # source viewer falls back to passage text. Attach a disk at /app/data to keep them.
      - key: RETAIN_PDFS
        value: "true"
      - key: EXTRACTION_CONCURRENCY
        value: "6"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: synapse-web
          property: host

  - type: web
    name: synapse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: synapse-api
          property: host
